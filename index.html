<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquina Tragaperras</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="img/sm.ico">
</head>
<body>

    <h1>Maquina Tragaperras</h1>

    <!-- Contador de créditos -->
    <div id="credits">Créditos: 10</div>
    <label for="bet">Apuesta: <span id="betValue">1</span> créditos</label>
    <input type="range" id="bet" name="bet" min="1" value="1">

    <!-- Contenedor de las ruedas -->
    <div class="slots">
        <div id="slot1" class="slot">🍒</div>
        <div id="slot2" class="slot">🍋</div>
        <div id="slot3" class="slot">🍊</div>
    </div>

    <!-- Botón para girar las ruedas -->
    <button onclick="spin()">¡Girar!</button>
    <button onclick="addCredits()" id="addCreditsBtn" style="display: none;">Añadir 5 Créditos</button>
    
    <!-- Resultado del juego -->
    <div id="result"></div>

    <!-- Elemento para mostrar el efecto de celebración -->
    <div id="celebration">🎉 ¡Ganaste! 🎉</div>

    <script src="script.js"></script> <!-- Vinculamos el JavaScript -->
</body>
</html>
