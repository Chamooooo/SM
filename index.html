<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquina Tragaperras</title>
    <link rel="stylesheet" href="styles.css"> <!-- Vinculamos el CSS -->
    <link rel="icon" href="img/sm.ico"> <!-- Icono de la página -->
</head>
<body>

    <h1>Maquina Tragaperras</h1>

    <!-- Contador de créditos -->
    <div id="credits">Créditos: 10</div>

    <!-- Contenedor de las ruedas -->
    <div class="slots">
        <div id="slot1" class="slot">🍒</div>
        <div id="slot2" class="slot">🍋</div>
        <div id="slot3" class="slot">🍊</div>
    </div>

    <!-- Botón para girar las ruedas -->
    <button onclick="spin()">¡Girar!</button>

    <!-- Resultado del juego -->
    <div id="result"></div>

    <!-- Elemento para mostrar el efecto de celebración -->
    <div id="celebration">🎉 ¡Ganaste! 🎉</div>

    <script src="script.js"></script> <!-- Vinculamos el JavaScript -->
</body>
</html>
